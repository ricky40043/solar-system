<!-- Three.js r128 (classic, has OrbitControls global via examples/js) -->

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script>
window.addEventListener('error', function(event) {
  var box = document.getElementById('runtime-error');
  if (!box) {
    box = document.createElement('pre');
    box.id = 'runtime-error';
    box.style.cssText = 'position:fixed;inset:20px;z-index:9999;white-space:pre-wrap;background:#240b0b;color:#ffe3e3;border:1px solid #ff7777;padding:16px;font:14px/1.5 monospace;';
    document.body.appendChild(box);
  }
  box.textContent += (event.message || 'runtime error') + '\n' + (event.filename || '') + ':' + (event.lineno || '') + ':' + (event.colno || '') + '\n';
});
</script>
<div id="root"></div>

<script src="data.js"></script>
<script src="textures.js"></script>
<script src="scene.js"></script>
<script src="walkSphere.js"></script>
<script src="walk.js"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
